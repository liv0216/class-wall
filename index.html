<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
  <style>
    /* 전체 기본 설정 & 파스텔 모눈 격자 배경 */
    body {
      font-family: 'Jua', sans-serif;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background-color: #fdfbf7;
      background-image: 
        linear-gradient(rgba(235, 225, 215, 0.35) 1.5px, transparent 1.5px),
        linear-gradient(90deg, rgba(235, 225, 215, 0.35) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: #4a4a4a;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
    }

    /* 상단 헤더 타이틀 */
    h1 {
      font-size: 32px;
      color: #ff6b81;
      text-shadow: 2px 2px 0px #ffeaa7;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px 0;
    }

    /* 로그인/사용자 상태 바 */
    #userArea {
      margin: 12px 0 20px 0;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border: 2px dashed #ffd1dc;
      border-radius: 20px;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(255, 182, 193, 0.15);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    #userArea button {
      font-family: 'Jua', sans-serif;
      padding: 6px 14px;
      cursor: pointer;
      border: 1.5px solid #ffccd5;
      border-radius: 15px;
      background: #fff0f3;
      color: #d6336c;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(214, 51, 108, 0.1);
      transition: all 0.2s ease;
    }
    #userArea button:hover {
      background: #ffe3e8;
      transform: translateY(-2px);
    }

    /* 메모 입력창 컨테이너 */
    #writer {
      margin: 20px 0 30px 0;
      background: #ffffff;
      padding: 18px 22px;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(180, 160, 140, 0.12);
      border: 2px solid #ffe8cc;
      display: inline-block;
      width: calc(100% - 44px);
      max-width: 580px;
    }
    .writer-title {
      font-size: 17px;
      color: #fd7e14;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #writer textarea {
      font-family: 'Gaegu', cursive, sans-serif;
      font-size: 21px;
      line-height: 1.4;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 2px dashed #ffd8a8;
      border-radius: 16px;
      background: #fffaf0;
      color: #333;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
    }
    #writer textarea:focus {
      border-color: #ffa94d;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(255, 169, 77, 0.18);
    }
    .input-tip {
      margin: 8px 0 0 4px;
      font-size: 13px;
      color: #868e96;
      font-family: 'Jua', sans-serif;
    }

    /* 담벼락 그리드 레이아웃 */
    #wall {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      align-items: flex-start;
      padding: 10px 0 40px 0;
    }

    /* 메모 카드 공통 기본 스타일 */
    .memo {
      position: relative;
      width: 230px;
      min-height: 130px;
      padding: 22px 16px 14px 16px;
      box-sizing: border-box;
      word-break: break-word;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.06);
    }
    .memo:hover {
      transform: translateY(-8px) scale(1.03) rotate(0deg) !important;
      box-shadow: 0 14px 25px rgba(0, 0, 0, 0.12);
      z-index: 10;
    }

    /* 메모 본문 텍스트 (손글씨 느낌) */
    .memo-text {
      font-family: 'Gaegu', cursive, sans-serif;
      font-size: 22px;
      line-height: 1.4;
      color: #2b2b2b;
      margin-top: 4px;
    }

    /* 삭제 버튼 (귀여운 동그라미) */
    .memo button.del-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      line-height: 20px;
      text-align: center;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.1);
      background: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      cursor: pointer;
      color: #adb5bd;
      padding: 0;
      transition: all 0.2s ease;
    }
    .memo button.del-btn:hover {
      background: #ff6b6b;
      color: #ffffff;
      transform: rotate(90deg) scale(1.1);
    }

    /* 작성자 정보 */
    .memo-author {
      font-size: 13px;
      color: #6c757d;
      margin-top: 12px;
      text-align: right;
      font-family: 'Jua', sans-serif;
    }

    /* ===================================================
       다양한 파스텔 색상 테마 (6종)
       =================================================== */
    .color-yellow {
      background: #fff9db;
      border: 1.5px solid #ffe066;
    }
    .color-pink {
      background: #ffe8ed;
      border: 1.5px solid #ffccd5;
    }
    .color-mint {
      background: #e6fcf5;
      border: 1.5px solid #96f2d7;
    }
    .color-blue {
      background: #e7f5ff;
      border: 1.5px solid #a5d8ff;
    }
    .color-purple {
      background: #f3f0ff;
      border: 1.5px solid #d0bfff;
    }
    .color-peach {
      background: #fff4e6;
      border: 1.5px solid #ffd8a8;
    }

    /* ===================================================
       다양한 모양 & 장식 (5종)
       =================================================== */
    /* 1. 마스킹 테이프 모양 */
    .shape-tape {
      border-radius: 18px 4px 18px 4px;
      transform: rotate(-1.5deg);
    }
    .shape-tape::before {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 55px;
      height: 18px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px dashed rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* 2. 빨간 압정 모양 */
    .shape-pin {
      border-radius: 6px 20px 6px 20px;
      transform: rotate(1.8deg);
    }
    .shape-pin::before {
      content: "📌";
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
    }

    /* 3. 하트 스티커 클립 모양 */
    .shape-heart {
      border-radius: 22px 22px 22px 6px;
      transform: rotate(-1deg);
    }
    .shape-heart::before {
      content: "💛";
      position: absolute;
      top: -10px;
      left: 14px;
      font-size: 16px;
    }

    /* 4. 귀여운 클립 모양 */
    .shape-clip {
      border-radius: 16px 16px 4px 16px;
      transform: rotate(1.5deg);
    }
    .shape-clip::before {
      content: "📎";
      position: absolute;
      top: -12px;
      right: 18px;
      font-size: 18px;
      transform: rotate(15deg);
    }

    /* 5. 둥근 젤리 모양 */
    .shape-jelly {
      border-radius: 28px 10px 28px 10px;
      transform: rotate(-0.5deg);
    }
    .shape-jelly::before {
      content: "🌸";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
    }

    /* ===================================================
       AI 코멘트 말풍선 및 버튼
       =================================================== */
    .ai-comment {
      margin-top: 12px;
      padding: 10px 12px;
      background: #ffffff;
      border: 1.5px solid #a5d8ff;
      border-radius: 14px;
      font-size: 13px;
      box-shadow: 0 3px 8px rgba(165, 216, 255, 0.25);
      position: relative;
    }
    .ai-comment::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 20px;
      border-width: 0 7px 7px 7px;
      border-style: solid;
      border-color: transparent transparent #a5d8ff transparent;
    }
    .ai-comment-title {
      font-family: 'Jua', sans-serif;
      font-size: 13px;
      color: #1971c2;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ai-comment-content {
      font-family: 'Gaegu', cursive, sans-serif;
      font-size: 18px;
      color: #1864ab;
      line-height: 1.35;
    }

    /* AI 코멘트 달기 버튼 */
    .ai-btn {
      font-family: 'Jua', sans-serif;
      margin-top: 10px;
      padding: 5px 10px;
      font-size: 12px;
      background: #e7f5ff;
      border: 1.5px solid #a5d8ff;
      border-radius: 12px;
      cursor: pointer;
      color: #1971c2;
      transition: all 0.2s ease;
      display: inline-block;
    }
    .ai-btn:hover {
      background: #d0ebff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📌 우리 반 담벼락 ✨</h1>

    <!-- 로그인 버튼과 사용자 상태가 들어오는 자리 -->
    <div id="userArea">로그인 확인 중...</div>

    <div id="writer">
      <div class="writer-title">✏️ 오늘 하루 생각이나 질문을 남겨보아요</div>
      <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터 (Shift+Enter는 줄바꿈)"></textarea>
      <p class="input-tip">💡 5글자 이상 작성 후 엔터(Enter)를 누르면 담벼락에 쏙 붙어요!</p>
    </div>

    <!-- 메모는 app.js가 그립니다 -->
    <div id="wall"></div>
  </div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
