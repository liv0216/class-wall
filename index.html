<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼과 상태가 표시되는 자리 */
    #userArea { margin: 12px 0; color: #333; font-size: 15px; }
    #userArea button { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: #fff; font-size: 14px; }
    #userArea button:hover { background: #f0f0f0; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 12px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 12px; width: 240px; font-size: 15px; border-radius: 6px; box-shadow: 1px 1px 4px rgba(0,0,0,0.05); word-break: break-word; }
    .memo button.del-btn { float: right; border: none; background: transparent; font-size: 16px; cursor: pointer; color: #888; }
    .memo button.del-btn:hover { color: #d32f2f; }

    /* AI 코멘트 말풍선 */
    .ai-comment {
      margin-top: 10px;
      padding: 8px 10px;
      background: #eef4ff;
      border-left: 3px solid #1976d2;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.4;
      color: #0d47a1;
    }
    .ai-comment-title {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 4px;
      color: #1565c0;
    }

    /* AI 코멘트 달기 버튼 */
    .ai-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      font-size: 12px;
      background: #f0f4f8;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      color: #1e293b;
    }
    .ai-btn:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>


  <!-- 로그인 버튼과 사용자 상태가 들어오는 자리 -->
  <div id="userArea">로그인 확인 중...</div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
